name: Apply expanded books package

on:
  push:
    branches:
      - publish-expanded-books-20261119
  pull_request:
    types:
      - opened

permissions:
  contents: write

jobs:
  apply-expanded-books:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publish-expanded-books-20261119

      - name: Verify and extract the publication package
        shell: bash
        run: |
          set -euo pipefail
          test -f .publish-upload/expanded-books-upload.tar.gz
          echo "e9d832a66e43ed85877e88064a3f6b10869640acf0a0e925c786f59c96db2b32  .publish-upload/expanded-books-upload.tar.gz" | sha256sum -c -
          python3 - <<'PY'
          import tarfile
          from pathlib import Path

          archive_path = Path(".publish-upload/expanded-books-upload.tar.gz")
          with tarfile.open(archive_path, "r:gz") as archive:
              members = archive.getmembers()
              assert len(members) == 162, f"Expected 162 files, found {len(members)}"
              for member in members:
                  path = Path(member.name)
                  assert not path.is_absolute() and ".." not in path.parts, member.name
                  assert member.isfile(), member.name
              archive.extractall(Path("."), members=members, filter="data")
              print(f"Extracted {len(members)} publication files")
          PY
          git rm -r --cached .publish-upload .github/workflows/apply-expanded-books.yml
          rm -rf .publish-upload .github/workflows/apply-expanded-books.yml
          git add -A
          if git diff --cached --quiet; then
            echo "The publication package produced no changes"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Expand twelve books and prepare edition 1.1"
          echo "Result tree: $(git rev-parse 'HEAD^{tree}')"
          test "$(git rev-parse 'HEAD^{tree}')" = "83a5c2b4b6b994d06f5d38bf423903aa92b9a1c4"
          git push origin HEAD:publish-expanded-books-20261119
