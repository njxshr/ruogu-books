name: Apply expanded books package

on:
  push:
    branches:
      - publish-expanded-books-20261119
    paths:
      - .github/workflows/apply-expanded-books.yml

permissions:
  contents: write

jobs:
  apply-expanded-books:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify and extract the publication package
        shell: bash
        run: |
          set -euo pipefail
          test -f .publish-upload/expanded-books-upload.tar.gz
          echo "e9d832a66e43ed85877e88064a3f6b10869640acf0a0e925c786f59c96db2b32  .publish-upload/expanded-books-upload.tar.gz" | sha256sum -c -
          test "$(tar -tzf .publish-upload/expanded-books-upload.tar.gz | wc -l)" -eq 162
          tar -xzf .publish-upload/expanded-books-upload.tar.gz
          git rm -r --cached .publish-upload .github/workflows/apply-expanded-books.yml
          rm -rf .publish-upload .github/workflows/apply-expanded-books.yml
          git add -A
          if git diff --cached --quiet; then
            echo "The publication package produced no changes"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Expand twelve books and prepare edition 1.1"
          test "$(git rev-parse 'HEAD^{tree}')" = "83a5c2b4b6b994d06f5d38bf423903aa92b9a1c4"
          git push origin HEAD:publish-expanded-books-20261119
